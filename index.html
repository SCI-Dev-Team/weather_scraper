<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOWRAM Weather Forecast</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .controls label {
            font-weight: 600;
            color: #333;
        }

        .controls select, .controls button {
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        .controls button {
            background: #667eea;
            color: white;
            font-weight: 600;
            transition: background 0.3s;
        }

        .controls button:hover {
            background: #5568d3;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            padding: 40px;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        .weather-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .weather-card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .area-name {
            font-size: 1.5em;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .hourly-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .hourly-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid #667eea;
            transition: transform 0.2s;
        }

        .hourly-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .hourly-item .day-period {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .hourly-item .weather-icon {
            width: 60px;
            height: 60px;
            margin: 10px 0;
        }

        .hourly-item .data-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            padding: 5px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .hourly-item .data-row:last-child {
            border-bottom: none;
        }

        .hourly-item .label {
            font-weight: 600;
            color: #666;
        }

        .hourly-item .value {
            color: #333;
        }

        .daily-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .daily-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .daily-item .day {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .daily-item .temp {
            font-size: 2em;
            font-weight: bold;
            margin: 10px 0;
        }

        .daily-item .humidity {
            font-size: 1.1em;
            margin-top: 10px;
        }

        .json-view {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            overflow-x: auto;
        }

        .json-view pre {
            margin: 0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌤️ MOWRAM Weather Forecast</h1>
            <p>Ministry of Water Resources and Meteorology</p>
        </div>

        <div class="controls">
            <label for="areaSelect">Select Area:</label>
            <select id="areaSelect">
                <option value="1">Takeo</option>
                <option value="2">Svay Rieng</option>
                <option value="3">Stung Treng</option>
                <option value="4">Siem Reap</option>
                <option value="5">Rattanakiri</option>
                <option value="6">Prey Veng</option>
                <option value="7">Preah Vihear</option>
                <option value="8">Pursat</option>
                <option value="9">Phnom Penh</option>
                <option value="10">Oddar Mean Chey</option>
                <option value="11">Mondolkiri</option>
                <option value="12">Sihanouk ville</option>
                <option value="13">Pailin</option>
                <option value="14">Kratie</option>
                <option value="15">Kandal</option>
                <option value="16">Kompot</option>
                <option value="17">Kompong Thom</option>
                <option value="18">Kompong Spoeu</option>
                <option value="19">Kompong Chnang</option>
                <option value="20">Kompong Cham</option>
                <option value="21">Kep</option>
                <option value="22">Koh Kong</option>
                <option value="23">Banteay Meanchey</option>
                <option value="24">Battambang</option>
                <option value="32">Tbong Khmum</option>
            </select>

            <label for="daySelect">Day:</label>
            <select id="daySelect">
                <option value="1">Day 1</option>
                <option value="2">Day 2</option>
                <option value="3">Day 3</option>
            </select>

            <button onclick="loadWeather()">Load Weather</button>
            <button onclick="toggleJsonView()">Toggle JSON</button>
        </div>

        <div id="loading" class="loading" style="display: none;">
            Loading weather data...
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="weatherContent"></div>

        <div id="jsonView" class="json-view" style="display: none;">
            <pre id="jsonContent"></pre>
        </div>
    </div>

    <script>
        const baseUrl = '/api/weather';

        function parseHTML(htmlString) {
            const parser = new DOMParser();
            return parser.parseFromString(htmlString, 'text/html');
        }

        function extractValues(row) {
            const cells = row.querySelectorAll('td.cellValeur');
            return Array.from(cells).map(cell => {
                const img = cell.querySelector('img');
                if (img) {
                    return {
                        value: img.getAttribute('title') || img.getAttribute('src'),
                        image: img.getAttribute('src')
                    };
                }
                return cell.textContent.trim();
            });
        }

        function parseWeatherData(html) {
            const doc = parseHTML(html);
            const days = ['Monday', 'Tuesday', 'Wednesday'];
            const periods = ['Morning', 'Afternoon', 'Night'];

            // Extract area name
            const areaSelect = doc.querySelector('#select_city option[selected]');
            const areaName = areaSelect ? areaSelect.textContent.trim() : 'Unknown';

            // Extract hourly forecast
            const rows = doc.querySelectorAll('table.WM tr');
            let humidityRow = null;
            let temperatureRow = null;
            let weatherRow = null;
            let windDirectionRow = null;
            let windSpeedRow = null;

            rows.forEach(row => {
                const firstCell = row.querySelector('td.cellIntitule1');
                if (firstCell) {
                    const text = firstCell.textContent.trim();
                    if (text.includes('Humidity')) humidityRow = row;
                    else if (text.includes('Temperature')) temperatureRow = row;
                    else if (text.includes('Weather')) weatherRow = row;
                    else if (text.includes('Wind direction')) windDirectionRow = row;
                    else if (text.includes('Wind speed')) windSpeedRow = row;
                }
            });

            const humidityValues = humidityRow ? extractValues(humidityRow) : [];
            const temperatureValues = temperatureRow ? extractValues(temperatureRow) : [];
            const weatherValues = weatherRow ? extractValues(weatherRow) : [];
            const windDirectionValues = windDirectionRow ? extractValues(windDirectionRow) : [];
            const windSpeedValues = windSpeedRow ? extractValues(windSpeedRow) : [];

            const hourlyForecast = [];
            days.forEach((day, dayIndex) => {
                periods.forEach((period, periodIndex) => {
                    const index = dayIndex * 3 + periodIndex;
                    hourlyForecast.push({
                        day: day,
                        period: period,
                        humidity: humidityValues[index] || null,
                        temperature: temperatureValues[index] || null,
                        weather: weatherValues[index] || null,
                        windDirection: windDirectionValues[index] || null,
                        windSpeed: windSpeedValues[index] || null
                    });
                });
            });

            // Extract daily forecast
            const dailyForecast = [];
            const tables = doc.querySelectorAll('table.WM');
            let dailyTable = null;

            tables.forEach(table => {
                const title = table.querySelector('h1.titreTableau');
                if (title && title.textContent.trim().includes('Daily Forecast')) {
                    dailyTable = table;
                }
            });

            if (dailyTable) {
                const dailyRows = dailyTable.querySelectorAll('tr');
                let maxHumidityRow = null;
                let maxTempRow = null;
                let minHumidityRow = null;
                let minTempRow = null;

                dailyRows.forEach(row => {
                    const firstCell = row.querySelector('td.cellIntitule1');
                    if (firstCell) {
                        const text = firstCell.textContent.trim().toLowerCase();
                        if (text.includes('max humidity')) maxHumidityRow = row;
                        else if (text.includes('max temperature')) maxTempRow = row;
                        else if (text.includes('min humidity')) minHumidityRow = row;
                        else if (text.includes('min temperature')) minTempRow = row;
                    }
                });

                const maxHumidityValues = maxHumidityRow ? extractValues(maxHumidityRow) : [];
                const maxTempValues = maxTempRow ? extractValues(maxTempRow) : [];
                const minHumidityValues = minHumidityRow ? extractValues(minHumidityRow) : [];
                const minTempValues = minTempRow ? extractValues(minTempRow) : [];

                days.forEach((day, index) => {
                    dailyForecast.push({
                        day: day,
                        maxHumidity: maxHumidityValues[index] || null,
                        maxTemperature: maxTempValues[index] || null,
                        minHumidity: minHumidityValues[index] || null,
                        minTemperature: minTempValues[index] || null
                    });
                });
            }

            return {
                area: areaName,
                hourlyForecast: hourlyForecast,
                dailyForecast: dailyForecast
            };
        }

        function displayWeather(data) {
            const content = document.getElementById('weatherContent');
            
            let html = `<div class="area-name">📍 ${data.area}</div>`;

            // Hourly Forecast
            html += '<div class="weather-card">';
            html += '<h2>Hourly Forecast</h2>';
            html += '<div class="hourly-grid">';
            
            data.hourlyForecast.forEach(item => {
                html += '<div class="hourly-item">';
                html += `<div class="day-period">${item.day} - ${item.period}</div>`;
                
                if (item.weather && item.weather.image) {
                    const imageUrl = item.weather.image.startsWith('http') 
                        ? item.weather.image 
                        : `http://cambodiameteo.com${item.weather.image}`;
                    html += `<img src="${imageUrl}" alt="${item.weather.value || 'Weather'}" class="weather-icon" onerror="this.style.display='none'">`;
                }
                
                html += `<div class="data-row"><span class="label">Temperature:</span><span class="value">${item.temperature}°C</span></div>`;
                html += `<div class="data-row"><span class="label">Humidity:</span><span class="value">${item.humidity}%</span></div>`;
                html += `<div class="data-row"><span class="label">Wind Speed:</span><span class="value">${item.windSpeed} Kph</span></div>`;
                
                if (item.windDirection && item.windDirection.value) {
                    html += `<div class="data-row"><span class="label">Wind Direction:</span><span class="value">${item.windDirection.value}</span></div>`;
                }
                
                if (item.weather && item.weather.value) {
                    const weatherDesc = item.weather.value.replace(/<br\s*\/?>/gi, ' ');
                    html += `<div class="data-row"><span class="label">Weather:</span><span class="value">${weatherDesc}</span></div>`;
                }
                
                html += '</div>';
            });
            
            html += '</div></div>';

            // Daily Forecast
            html += '<div class="weather-card">';
            html += '<h2>Daily Forecast</h2>';
            html += '<div class="daily-grid">';
            
            data.dailyForecast.forEach(item => {
                html += '<div class="daily-item">';
                html += `<div class="day">${item.day}</div>`;
                html += `<div class="temp">${item.maxTemperature}°C / ${item.minTemperature}°C</div>`;
                html += `<div>Max: ${item.maxTemperature}°C | Min: ${item.minTemperature}°C</div>`;
                html += `<div class="humidity">Humidity: ${item.maxHumidity}% / ${item.minHumidity}%</div>`;
                html += '</div>';
            });
            
            html += '</div></div>';

            content.innerHTML = html;
            document.getElementById('jsonContent').textContent = JSON.stringify(data, null, 2);
        }

        async function loadWeather() {
            const areaId = document.getElementById('areaSelect').value;
            const day = document.getElementById('daySelect').value;
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const content = document.getElementById('weatherContent');

            loading.style.display = 'block';
            error.style.display = 'none';
            content.innerHTML = '';

            try {
                const response = await fetch(baseUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: `menu=116&lang=km&day=${day}&areaid=${areaId}`
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const html = await response.text();
                const weatherData = parseWeatherData(html);
                displayWeather(weatherData);
            } catch (err) {
                error.textContent = `Error loading weather data: ${err.message}`;
                error.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        }

        function toggleJsonView() {
            const jsonView = document.getElementById('jsonView');
            jsonView.style.display = jsonView.style.display === 'none' ? 'block' : 'none';
        }

        // Load weather on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadWeather();
        });
    </script>
</body>
</html>
