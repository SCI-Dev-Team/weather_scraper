<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOWRAM Weather Forecast</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .controls label {
            font-weight: 600;
            color: #333;
        }
        .controls select, .controls button {
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }
        .controls button {
            background: #667eea;
            color: white;
            font-weight: 600;
            transition: background 0.3s;
        }
        .controls button:hover {
            background: #5568d3;
        }
        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            padding: 40px;
        }
        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }
        .weather-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .weather-card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        .area-name {
            font-size: 1.5em;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }
        .hourly-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .hourly-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid #667eea;
            transition: transform 0.2s;
        }
        .hourly-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .hourly-item .day-period {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        .hourly-item .weather-icon {
            width: 60px;
            height: 60px;
            margin: 10px 0;
        }
        .hourly-item .data-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            padding: 5px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        .hourly-item .data-row:last-child {
            border-bottom: none;
        }
        .hourly-item .label {
            font-weight: 600;
            color: #666;
        }
        .hourly-item .value {
            color: #333;
        }
        .daily-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .daily-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        .daily-item .day {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .daily-item .temp {
            font-size: 2em;
            font-weight: bold;
            margin: 10px 0;
        }
        .daily-item .humidity {
            font-size: 1.1em;
            margin-top: 10px;
        }
        .json-view {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            overflow-x: auto;
        }
        .json-view pre {
            margin: 0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌤️ MOWRAM Weather Forecast</h1>
            <p>Ministry of Water Resources and Meteorology</p>
        </div>
        <div class="controls">
            <label for="areaSelect">Select Area:</label>
            <select id="areaSelect">
                <option value="">Loading provinces...</option>
            </select>
            <button onclick="loadWeather()">Load Weather</button>
            <button onclick="toggleJsonView()">Toggle JSON</button>
        </div>
        <div id="loading" class="loading" style="display: none;">Loading weather data...</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="weatherContent"></div>
        <div id="jsonView" class="json-view" style="display: none;">
            <pre id="jsonContent"></pre>
        </div>
    </div>
    <script src="/client.js"></script>
</body>
</html>
