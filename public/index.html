<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambodia Weather Dashboard</title>
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #5568d3;
            --accent: #764ba2;
            --success: #2ecc71;
            --warning: #f39c12;
            --danger: #e74c3c;
            --bg: #f0f2f5;
            --card: #ffffff;
            --text: #2d3436;
            --text-light: #636e72;
            --border: #dfe6e9;
            --radius: 12px;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text);
        }

        /* ── Header ────────────────────────────────────── */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            padding: 28px 20px 20px;
            text-align: center;
        }
        .header h1 { font-size: 2em; margin-bottom: 4px; text-shadow: 1px 1px 3px rgba(0,0,0,0.2); }
        .header p { opacity: 0.9; font-size: 0.95em; }

        .container { max-width: 1280px; margin: 0 auto; padding: 0 16px 40px; }

        /* ── Controls Bar ──────────────────────────────── */
        .controls {
            background: var(--card);
            padding: 16px 20px;
            border-radius: var(--radius);
            margin: -24px auto 20px;
            position: relative;
            z-index: 10;
            box-shadow: var(--shadow);
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            max-width: 1280px;
        }
        .controls label { font-weight: 600; color: var(--text); white-space: nowrap; }
        .controls select {
            padding: 9px 14px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background: white;
            min-width: 180px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .controls select:focus { border-color: var(--primary); outline: none; }

        .btn {
            padding: 9px 18px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary { background: #e8eaf6; color: var(--primary); }
        .btn-secondary:hover { background: #c5cae9; }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #27ae60; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-warning:hover { background: #e67e22; }

        /* ── Tabs ──────────────────────────────────────── */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0;
            overflow-x: auto;
        }
        .tab {
            padding: 12px 22px;
            border: none;
            background: none;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-light);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tab:hover { color: var(--primary); }
        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .tab-icon { font-size: 16px; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ── Cards ─────────────────────────────────────── */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            overflow: hidden;
        }
        .card-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-header h2 {
            font-size: 1.25em;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-body { padding: 20px 24px; }

        .area-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 1.05em;
            margin-bottom: 16px;
        }

        /* ── Grids ─────────────────────────────────────── */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        /* ── Hourly Forecast Item (MOWRAM) ─────────────── */
        .forecast-item {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 16px;
            border-left: 4px solid var(--primary);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .forecast-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102,126,234,0.15);
        }
        .forecast-item .day-label {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.05em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
            font-size: 0.92em;
        }
        .data-row:last-child { border-bottom: none; }
        .data-row .label { font-weight: 600; color: var(--text-light); }
        .data-row .value { color: var(--text); font-weight: 500; }
        .weather-icon { width: 36px; height: 36px; vertical-align: middle; }

        /* ── Daily Cards (MOWRAM) ──────────────────────── */
        .daily-card {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        .daily-card .day { font-size: 1.15em; font-weight: 700; margin-bottom: 8px; }
        .daily-card .temp { font-size: 2em; font-weight: 700; margin: 6px 0; }
        .daily-card .detail { opacity: 0.9; font-size: 0.9em; margin-top: 4px; }

        /* ── Windy Forecast ─────────────────────────────── */
        .windy-hour-card {
            background: #f0f4ff;
            border-radius: 10px;
            padding: 14px 16px;
            border: 1px solid #dce3f7;
            transition: transform 0.15s;
        }
        .windy-hour-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(102,126,234,0.12);
        }
        .windy-time {
            font-weight: 700;
            color: var(--primary);
            font-size: 0.95em;
            margin-bottom: 8px;
        }
        .windy-metric {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            font-size: 0.88em;
        }
        .windy-metric .wm-label { color: var(--text-light); }
        .windy-metric .wm-value { font-weight: 600; }

        /* wind arrow */
        .wind-arrow {
            display: inline-block;
            font-size: 14px;
            transition: transform 0.2s;
        }

        /* ── Air Quality ───────────────────────────────── */
        .aq-card {
            border-radius: 10px;
            padding: 18px;
            text-align: center;
            color: white;
        }
        .aq-card.good { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .aq-card.moderate { background: linear-gradient(135deg, #f39c12, #e67e22); }
        .aq-card.poor { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .aq-card .aq-label { font-size: 0.85em; opacity: 0.9; margin-bottom: 4px; }
        .aq-card .aq-value { font-size: 1.6em; font-weight: 700; }
        .aq-card .aq-unit { font-size: 0.75em; opacity: 0.8; }
        .aq-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        /* ── Webcams ───────────────────────────────────── */
        .webcam-card {
            border-radius: 10px;
            overflow: hidden;
            background: var(--card);
            border: 1px solid var(--border);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .webcam-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
        }
        .webcam-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: #eee;
        }
        .webcam-info {
            padding: 12px 14px;
        }
        .webcam-info .wc-title {
            font-weight: 700;
            font-size: 0.95em;
            margin-bottom: 4px;
            color: var(--text);
        }
        .webcam-info .wc-location {
            font-size: 0.82em;
            color: var(--text-light);
        }
        .webcam-info .wc-status {
            display: inline-block;
            margin-top: 6px;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: 600;
        }
        .wc-status.active { background: #d4edda; color: #155724; }
        .wc-status.inactive { background: #f8d7da; color: #721c24; }

        /* ── Status / Feedback ─────────────────────────── */
        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }
        .loading-spinner::before {
            content: '';
            display: block;
            width: 36px;
            height: 36px;
            margin: 0 auto 12px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .alert {
            padding: 14px 20px;
            border-radius: var(--radius);
            margin-bottom: 16px;
            font-size: 0.95em;
        }
        .alert-error { background: #ffeaea; color: var(--danger); border: 1px solid #f5c6cb; }
        .alert-success { background: #eafaf1; color: #155724; border: 1px solid #c3e6cb; }
        .alert-info { background: #e8f4fd; color: #1565c0; border: 1px solid #b3d7f2; }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }
        .empty-state .empty-icon { font-size: 2.5em; margin-bottom: 10px; }
        .empty-state p { font-size: 0.95em; }

        /* ── JSON View ─────────────────────────────────── */
        .json-view {
            background: #1e1e2e;
            color: #cdd6f4;
            padding: 20px;
            border-radius: var(--radius);
            margin-top: 16px;
            overflow-x: auto;
            display: none;
        }
        .json-view pre {
            margin: 0;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
        }

        /* ── Responsive ────────────────────────────────── */
        @media (max-width: 768px) {
            .header h1 { font-size: 1.5em; }
            .controls { flex-direction: column; align-items: stretch; margin: -16px 8px 16px; }
            .controls select { min-width: auto; width: 100%; }
            .tabs { gap: 0; }
            .tab { padding: 10px 14px; font-size: 13px; }
            .grid-3, .grid-2, .grid-4 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🌤️ Cambodia Weather Dashboard</h1>
    <p>MOWRAM · Windy · Real-time Forecast Data</p>
</div>

<div class="controls">
    <label for="areaSelect">📍 Province:</label>
    <select id="areaSelect">
        <option value="">Loading provinces...</option>
    </select>
    <button class="btn btn-primary" onclick="loadAllData()">Load Data</button>
    <button class="btn btn-secondary" onclick="toggleJsonView()">{ } JSON</button>
    <button class="btn btn-success" onclick="triggerScrape('meteo')">⟳ Scrape Meteo</button>
    <button class="btn btn-warning" onclick="triggerScrape('windy')">⟳ Scrape Windy</button>
    <button class="btn btn-warning" onclick="triggerScrape('airquality')" style="background:#8e44ad;">⟳ Scrape Air Quality</button>
</div>

<div class="container">
    <!-- Tabs -->
    <div class="tabs" id="mainTabs">
        <button class="tab active" data-tab="mowram">
            <span class="tab-icon">🏛️</span> MOWRAM Forecast
        </button>
        <button class="tab" data-tab="windy">
            <span class="tab-icon">🌊</span> Windy Forecast
        </button>
        <button class="tab" data-tab="airquality">
            <span class="tab-icon">🌬️</span> Air Quality
        </button>
        <button class="tab" data-tab="webcams">
            <span class="tab-icon">📷</span> Webcams
        </button>
    </div>

    <!-- Loading / Error -->
    <div id="loading" class="loading-spinner" style="display:none;">Loading data...</div>
    <div id="error" class="alert alert-error" style="display:none;"></div>

    <!-- Tab: MOWRAM -->
    <div class="tab-content active" id="tab-mowram">
        <div id="mowramContent"></div>
    </div>

    <!-- Tab: Windy Forecast -->
    <div class="tab-content" id="tab-windy">
        <div id="windyContent"></div>
    </div>

    <!-- Tab: Air Quality -->
    <div class="tab-content" id="tab-airquality">
        <div id="aqContent"></div>
    </div>

    <!-- Tab: Webcams -->
    <div class="tab-content" id="tab-webcams">
        <div id="webcamContent"></div>
    </div>

    <!-- JSON View -->
    <div class="json-view" id="jsonView">
        <pre id="jsonContent"></pre>
    </div>
</div>

<script src="/client.js"></script>
</body>
</html>
